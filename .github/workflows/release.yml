# 打 v 开头的 tag（如 v0.0.1）时自动构建 Android APK 和 iOS IPA，
# 并把产物附加到对应的 GitHub Release 上。
name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 允许创建 Release 并上传附件

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      # 音频不入库，构建前从 assets/audio 复制进安卓工程
      - name: Sync audio assets into android project
        run: node scripts/sync-android-audio.js

      # 正式签名密钥不入库。优先用仓库 Secret（本地密钥 base64 后配置到
      # Settings -> Secrets -> ANDROID_RELEASE_KEYSTORE_BASE64）；
      # 没配 Secret 时临时生成一个同参数的密钥兜底（签名会和本地版不一致，
      # 覆盖安装本地打的包时需要先卸载）。
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/sixty-release.keystore
            echo "Using keystore from secret"
          else
            keytool -genkeypair -v \
              -keystore android/app/sixty-release.keystore \
              -alias sixty -storepass sixtyseconds -keypass sixtyseconds \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=60s, OU=60s, O=60s, L=-, S=-, C=CN"
            echo "::warning::No ANDROID_RELEASE_KEYSTORE_BASE64 secret, generated a throwaway keystore"
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK with tag
        run: cp android/app/build/outputs/apk/release/app-release.apk "60s-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: 60s-*.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 60s-*.apk

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # ios/ 不入库，由 prebuild 按 app.json 生成原生工程（内部会执行 pod install）
      - name: Generate iOS native project
        run: npx expo prebuild -p ios
        env:
          CI: '1'

      # 没有 Apple 开发者证书，关闭签名构建出 .app，再手工打包成未签名 IPA。
      # 未签名 IPA 不能直接安装到 iPhone，需要用自己的 Apple ID 重签名
      # （Xcode / Sideloadly / AltStore 等工具）后才能装机。
      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --quiet

      - name: Package unsigned IPA
        run: |
          APP=$(ls -d build/app.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "60s-${GITHUB_REF_NAME}-ios-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: 60s-*-ios-unsigned.ipa

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 60s-*-ios-unsigned.ipa
